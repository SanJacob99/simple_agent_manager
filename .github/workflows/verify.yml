name: Verify

# Verifies functionality of the app: type-checks and builds, runs the unit
# test suite (vitest), and runs the browser end-to-end suite (Playwright).
# The OpenRouter-backed unit and e2e suites are intentionally excluded here
# because they require live API credentials; this workflow runs green
# without any secrets.
#
# The `build-and-test` job is the gating check. The `e2e` job is advisory
# (continue-on-error) for now: the Playwright specs predate a bootable
# backend and currently drift from the live UI, so they run for diagnostics
# (screenshots/traces uploaded as artifacts) without blocking merges. Once
# the specs are brought back in sync, drop `continue-on-error` to gate on it.

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run

  e2e:
    name: End-to-end tests (advisory)
    runs-on: ubuntu-latest
    # Advisory until the Playwright specs are re-synced with the current UI.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
